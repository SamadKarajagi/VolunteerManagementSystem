<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="app.js"></script> 
</head>
<body>

    <header>
        <h1>Event Volunteer Hub</h1>
        <button id="logout-btn" onclick="logoutUser()" class="create-btn" style="position: absolute; top: 10px; right: 10px; padding: 8px 15px; font-size: 0.9em; background-color: #e74c3c;">
            <i class="fas fa-sign-out-alt"></i> Sign Out
        </button>
    </header>

    <main>
        <section id="event-hub-page" class="card">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: #004d40;"><i class="fas fa-calendar-check"></i> Event Management</h2>
                <a id="dashboard-link-btn" href="dashboard.html" class="create-btn hidden" style="background-color: #008080;">
                    <i class="fas fa-chart-line"></i> Organizer Dashboard
                </a>
            </div>
            
            <div id="organizer-section" class="hidden">
                <h2><i class="fas fa-plus-circle"></i> Event & Role Creation</h2>
                <form id="event-form">
                    <label for="event-title">Event Title:</label>
                    <input type="text" id="event-title" placeholder="Enter Title" required>

                    <label for="event-date">Date & Time:</label>
                    <input type="text" id="event-date" placeholder="e.g., 21/11/2025 10:00 AM" required>
                    
                    <label for="event-desc">Description:</label>
                    <textarea id="event-desc" rows="2" placeholder="Enter About Event"></textarea>

                    <label for="role-name">Volunteer Role Name:</label>
                    <input type="text" id="role-name" placeholder="Enter The Role Here" required>

                    <label for="role-slots">Required Slots:</label>
                    <input type="number" id="role-slots" min="1" value="1" required>

                    <button type="submit" class="create-btn"><i class="fas fa-calendar-plus"></i> Create Event & Role</button>
                </form>
                <hr style="margin: 30px 0; border-top: 1px dashed #ccc;">
            </div>

            <section id="volunteer-section">
                <h2><i class="fas fa-users-cog"></i> Upcoming Events & Volunteer Sign-up</h2>
                <div id="events-list">
                    <p>Loading events...</p>
                </div>
            </section>
        </section>
    </main>

    <div id="signUpModal" class="modal hidden">
        <div class="modal-content card">
            <span class="close-button" id="closeModalBtn">&times;</span>
            <h2>Volunteer Sign Up</h2>
            <p id="modal-event-details" class="event-details-text">Signing up for: [Event Title] - [Role Name]</p>
            
            <form id="volunteer-form">
                <input type="hidden" id="modal-event-index">
                <input type="hidden" id="modal-role-index">

                <label for="volunteer-name">Your Full Name:</label>
                <input type="text" id="volunteer-name" required placeholder="Enter your full name">

                <label for="volunteer-email">Your Email:</label>
                <input type="email" id="volunteer-email" required placeholder="name@example.com">

                <button type="submit" class="create-btn"><i class="fas fa-check-circle"></i> Confirm Sign-up</button>
            </form>
        </div>
    </div>
    
    <div id="volunteerActionModal" class="modal hidden">
        <div class="modal-content card">
            <span class="close-button" id="closeActionModal">&times;</span>
            <h2>Volunteer Action</h2>
            <p id="action-event-details" class="event-details-text">Action for: [Event Title] - [Role Name]</p>
            
            <form id="cancelSwapForm">
                <input type="hidden" id="action-event-index">
                <input type="hidden" id="action-role-index">

                <div id="action-options">
                    <label>What would you like to do?</label>
                    <select id="volunteer-action-type" required>
                        <option value="cancel">Cancel Sign-up (Free slot)</option>
                        <option value="swap">Propose a Swap (Notify organizer)</option>
                    </select>
                </div>

                <button type="submit" class="create-btn"><i class="fas fa-paper-plane"></i> Submit Action</button>
            </form>
        </div>
    </div>

    <footer>&copy; 2026 Volunteer Hub</footer>

    <script>
        document.addEventListener('DOMContentLoaded', checkAuthAndRenderHub);
    </script>
</body>
</html>
